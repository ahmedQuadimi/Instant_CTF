{% extends "base.html" %}
{% load ui_extras %}
{% block title %}Sign Out — Instant CTF{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="/static/css/platform.css">
{% endblock %}

{% block content %}
  <section class="auth-page">
    <div class="form content-form">
      <h1>Sign Out</h1>
      <p class="meta-line">Are you sure you want to sign out of Instant CTF?</p>
      <form method="POST" action="{% url 'account_logout' %}" data-no-warn>
        {% csrf_token %}
        <button type="submit" class="oauthButton">→ SIGN OUT</button>
      </form>
      <a href="{% url 'home' %}" class="oauthButton">Cancel</a>
    </div>
  </section>
{% endblock %}
