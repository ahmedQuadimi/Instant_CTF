{% extends 'base.html' %}

{% block title %}Create Challenge{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="/static/css/platform.css">
{% endblock %}

{% block content %}
  <section class="platform-stack">
    <h1>Create Challenge</h1>

  </section>
{% endblock %}
