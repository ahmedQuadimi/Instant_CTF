{% extends "base.html" %}
{% block title %}Password Updated — Instant CTF{% endblock %}

{% block extra_css %}
<style>
  .auth-card {
    max-width: 440px;
    margin: 40px auto;
    background: var(--bg-surface);
    border: var(--border);
    border-radius: var(--radius);
    padding: clamp(28px, 5vw, 48px);
    display: grid;
    gap: 16px;
    text-align: center;
  }
  .auth-card h1 { font-size: 1.5rem; margin: 0; }
  .auth-card p { color: var(--text-secondary); margin: 0; }
  .check-icon { font-size: 2.5rem; color: var(--accent-primary); }
  .auth-btn {
    min-height: 44px;
    padding: 10px 20px;
    background: var(--accent-primary);
    color: var(--bg-base);
    border: none;
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  .auth-btn:hover { transform: translateY(-1px); text-decoration: none; }
</style>
{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="check-icon">✓</div>
  <h1>Password Updated</h1>
  <p>Your password has been successfully reset. You can now sign in with your new credentials.</p>
  <a href="{% url 'account_login' %}" class="auth-btn">→ SIGN IN</a>
</div>
{% endblock %}
